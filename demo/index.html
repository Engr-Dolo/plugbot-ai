<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlugBot AI Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
      background: #f3f4f6;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 20px;
    }

    section {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 28px;
      overflow-wrap: anywhere;
    }

    .demo-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .demo-avatar-wrap {
      position: relative;
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
    }

    .demo-avatar {
      width: 56px;
      height: 56px;
      border: 1px solid #bfdbfe;
      border-radius: 50%;
      background: #0f172a;
      object-fit: cover;
      object-position: 50% 42%;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }

    .demo-avatar-fallback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    p {
      margin: 0 0 14px;
      line-height: 1.6;
    }

    code {
      background: #eef2ff;
      border-radius: 4px;
      padding: 2px 6px;
    }

    @media (max-width: 480px) {
      main {
        padding: 32px 14px;
      }

      section {
        padding: 22px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section>
      <div class="demo-brand">
        <span class="demo-avatar-wrap">
          <img class="demo-avatar" src="../widget/assets/plugbot-ai-avatar.png" width="56" height="56" alt="PlugBot AI assistant avatar" loading="eager" decoding="async" />
          <span class="demo-avatar demo-avatar-fallback" hidden>PB</span>
        </span>
        <div>
          <h1>PlugBot AI Demo</h1>
          <p>AI assistant widget preview</p>
        </div>
      </div>
      <p>
        This page loads the vanilla JavaScript widget from
        <code>../widget/plugbot-widget.js</code>.
      </p>
      <p>
        For local development, start the backend on
        <code>http://localhost:3000</code>, then open this page and use the
        launcher in the bottom-right corner.
      </p>
      <p>
        API URL: <code id="plugbot-api-url">loading...</code>
      </p>
    </section>
  </main>

  <script>
    window.PlugBotDemo = window.PlugBotDemo || {
      productionApiUrl: "https://plugbot-ai-6zea.onrender.com/"
    };

    const params = new URLSearchParams(window.location.search);
    const isLocalDemo =
      window.location.protocol === "file:" ||
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";
    const apiUrl =
      params.get("apiUrl") ||
      (isLocalDemo ?
        "http://localhost:3000" :
        window.PlugBotDemo.productionApiUrl);

    document.getElementById("plugbot-api-url").textContent = apiUrl;

    const demoAvatar = document.querySelector(".demo-avatar-wrap img");
    demoAvatar.addEventListener("error", () => {
      demoAvatar.hidden = true;
      demoAvatar.nextElementSibling.hidden = false;
    });

    const widgetScript = document.createElement("script");
    widgetScript.src = "../widget/plugbot-widget.js";
    widgetScript.dataset.botId = "timetomarket-services";
    widgetScript.dataset.apiUrl = apiUrl;
    widgetScript.dataset.title = "PlugBot AI";
    document.body.appendChild(widgetScript);
  </script>
</body>

</html>
